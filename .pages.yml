# Pages CMS config: https://pagescms.org/docs/configuration/
# Sign in at https://app.pagescms.org with GitHub and open this repo.
# Every save is a commit; Cloudflare rebuilds the site automatically.

media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Writing
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      fields: [title, pubDate, kind, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        description: One or two sentences shown in lists and link previews.
        type: text
      - name: pubDate
        label: Published
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: Updated
        type: date
        options:
          format: yyyy-MM-dd
      - name: kind
        label: Type
        type: select
        default: post
        options:
          values: [post, note]
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft (hidden from the live site)
        type: boolean
        default: false
      - name: archive
        label: From the old site
        type: boolean
        hidden: true
      - name: body
        label: Post
        type: rich-text

  - name: research
    label: Research
    type: collection
    path: src/content/research
    filename: "{primary}.md"
    view:
      fields: [title, timeframe, featured]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: timeframe
        label: Timeframe
        type: string
        required: true
      - name: areas
        label: Areas
        type: string
        list: true
      - name: featured
        label: Show on homepage
        type: boolean
      - name: draft
        label: Draft
        type: boolean
      - name: body
        label: Write-up
        type: rich-text

  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary for search and link previews
        type: text
      - name: updatedDate
        label: Last updated (shown on the Now page)
        type: date
        options:
          format: yyyy-MM-dd
      - name: body
        label: Content
        type: rich-text

  - name: lab
    label: Lab
    type: collection
    path: src/content/lab
    filename: "{primary}.md"
    view:
      fields: [title, status, order]
      primary: title
      sort: [order, title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: One-line description
        type: text
        required: true
      - name: status
        label: Status
        type: select
        default: idea
        options:
          values: [live, building, idea]
      - name: url
        label: Link (leave empty to use /lab/<file-name>/ once live)
        type: string
      - name: image
        label: Card image (optional; a drawn thumbnail is used otherwise)
        type: image
      - name: thumb
        label: Drawn thumbnail style
        type: select
        default: line
        options:
          values: [rings, table, line, bars]
      - name: order
        label: Sort order (lower comes first)
        type: number
      - name: body
        label: Notes (not shown yet)
        type: rich-text

  - name: home
    label: Homepage
    type: file
    path: src/data/home.json
    fields:
      - name: tagline
        label: Tagline (blue italic line under your name)
        type: text
      - name: intro
        label: Intro paragraph
        type: text
      - name: highlight
        label: Phrase to highlight in the intro
        type: string
      - name: handNote
        label: Handwritten note above the SQL box
        type: string
      - name: photo
        label: Photo
        type: image
      - name: photoLabel
        label: Photo label lines
        type: string
        list: true

  - name: dataset
    label: SQL box data
    type: file
    path: src/data/dataset.json
    fields:
      - name: starters
        label: Starter questions
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: sql
            type: code
      - name: me
        label: "Table: me"
        type: object
        list: true
        fields:
          - name: field
            type: string
          - name: value
            type: string
      - name: jobs
        label: "Table: jobs"
        type: object
        list: true
        fields:
          - name: start_year
            type: number
          - name: end_year
            type: number
          - name: title
            type: string
          - name: org
            type: string
      - name: interests
        label: "Table: interests"
        type: object
        list: true
        fields:
          - name: topic
            type: string
          - name: level
            type: number
